    <!-- Dynamic absolute URL resolver for webviews & scrapers inspecting live DOM -->
    <script>
      (function () {
        try {
          var o = window.location.origin;
          var p = window.location.pathname.replace(/\/[^\/]*$/, '/');
          var b = (o && o !== 'null') ? (o + p) : '';
          if (!b) return;
          var sel = 'meta[property^="og:image"], meta[name="twitter:image"], meta[itemprop="image"], link[rel="image_src"]';
          var nodes = document.querySelectorAll(sel);
          for (var i = 0; i < nodes.length; i++) {
            var a = nodes[i].hasAttribute('content') ? 'content' : 'href';
            var v = nodes[i].getAttribute(a);
            if (v && !/^https?:\/\//i.test(v)) {
              nodes[i].setAttribute(a, b + v.replace(/^\.?\//, ''));
            }
          }
          var u = document.querySelector('meta[property="og:url"]');
          if (u) {
            var c = u.getAttribute('content');
            if (!c || c === './' || c.indexOf('YOUR-SITE') !== -1 || !/^https?:\/\//i.test(c)) {
              u.setAttribute('content', window.location.href);
            }
          }
        } catch (e) {}
      })();
    </script>
